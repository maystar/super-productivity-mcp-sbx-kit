schemaVersion: "1"
kind: mixin
name: super-productivity-mcp
displayName: Super Productivity MCP
description: >-
  Installiert die Python-Abhängigkeit für den Super-Productivity-MCP-Server und registriert ihn
  user-scoped (~/.claude.json) in der Sandbox — funktioniert unabhängig davon, welches Projekt
  als Workdir gemountet ist. Der Host-HOME-Pfad wird automatisch aus dem gemounteten
  IPC-Verzeichnis abgeleitet, kein manuelles Kit-Argument nötig.

# ⚠️ UNVERIFIZIERT (von einem Agenten ohne sbx-Zugriff erstellt, siehe TODO.md):
# Die live nachgeschlagene Docker-Sandboxes-Kit-Referenz (docs.docker.com/ai/sandboxes/customize/
# kit-reference.md, Stand dieser Session) verwendet den Schlüssel `setup:` mit `install:`/`files:`
# darunter. Die ursprüngliche Anleitung (super-productivity-sbx-kit-in-sandbox.md) verwendete
# stattdessen `commands: install:` auf oberster Ebene. Da Kits laut Docker-Doku "experimentell"
# sind, bitte vor dem ersten echten `sbx run` gegen die dann aktuelle Doku/CLI-Hilfe verifizieren,
# welcher Schlüssel tatsächlich gilt — im Zweifel `setup:` unten durch `commands:` ersetzen.
setup:
  install:
    - command: "pip install --user --break-system-packages superproductivity-mcp==2.2.1"
      user: "1000"
      description: "superproductivity-mcp installieren"

    # Der zweite Workdir-Pfad aus `sbx run ... <projekt> "$HOST_HOME/.local/share/super-productivity-mcp"`
    # (HOST_HOME = Host-Shell-$HOME beim sbx-run-Aufruf) landet 1:1 unter demselben absoluten Pfad
    # in der Sandbox. Der Verzeichnisname ist fix (".local/share/super-productivity-mcp"), daraus
    # lässt sich der Host-HOME-Pfad ableiten. Das Ergebnis wird zur Diagnose als SP_HOST_HOME
    # persistiert UND direkt genutzt, um den MCP-Server user-scoped in ~/.claude.json zu
    # registrieren (Skript kommt über files/home/.sp-mcp-kit/, siehe unten — läuft vor "install").
    - command: >
        FOUND=$(find /home -maxdepth 4 -type d -path '/home/*/.local/share/super-productivity-mcp' 2>/dev/null | head -n1);
        if [ -n "$FOUND" ]; then
          HOST_HOME=$(dirname "$(dirname "$(dirname "$FOUND")")");
          echo "export SP_HOST_HOME=$HOST_HOME" >> /etc/sandbox-persistent.sh;
          python3 "$HOME/.sp-mcp-kit/write_user_mcp_config.py" "$HOST_HOME";
        else
          echo "WARNUNG: Kein gemountetes .local/share/super-productivity-mcp unter /home/*/ gefunden. Der super-productivity-MCP-Server wurde NICHT in ~/.claude.json registriert." >&2;
        fi
      user: "1000"
      description: "Host-HOME-Pfad ableiten und MCP-Server user-scoped in ~/.claude.json registrieren"

# Statische Datei, automatisch vor obigen "install"-Commands in die Sandbox kopiert
# (files/home/... -> /home/agent/...): kits/super-productivity-mcp/files/home/.sp-mcp-kit/write_user_mcp_config.py
