schemaVersion: "2"
kind: mixin
name: super-productivity-rest-mcp
displayName: Super Productivity REST API Access
description: >-
  Gibt der Sandbox Netzwerkzugriff auf die Super Productivity Local REST API,
  die auf dem Host unter 127.0.0.1:3876 läuft (erreicht via host.docker.internal).
  Aktueller Stand: reine Netzwerkfreigabe zum Verifizieren der Erreichbarkeit.
  Der eigentliche MCP-Server (der die REST-Endpunkte als Claude-Code-Tools kapselt)
  ist ein noch folgender Ausbauschritt, siehe TODO.md.

# Hinweis: Der ursprüngliche Versuch mit schemaVersion "1" scheiterte am echten sbx mit
# "field permissions not found in type spec.SpecFile" — nicht weil das Feld grundsätzlich
# nicht existiert (der Nutzer verwendet permissions.network.allow bereits erfolgreich in
# anderen Kits), sondern weil es offenbar erst ab schemaVersion "2" Teil des Schemas ist.
#
# ⚠️ Weiterhin unverifiziert (kein sbx-Zugriff von hier aus möglich): Ob die Allow-Liste
# intern gegen "host.docker.internal:<port>" oder "localhost:<port>" matcht. Ein früherer
# Testaufruf (curl http://host.docker.internal:3876 aus einer anderen Sandbox) wurde von der
# Netzwerk-Policy als Domain "localhost:3876" geloggt/geblockt — nicht als
# "host.docker.internal:3876". Deshalb sind unten beide Varianten eingetragen; nach dem
# ersten echten Test (TODO.md Schritt 6) auf die tatsächlich wirksame Variante kürzen.
permissions:
  network:
    allow:
      - host.docker.internal:3876
      - localhost:3876
