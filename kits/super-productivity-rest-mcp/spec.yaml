schemaVersion: "1"
kind: mixin
name: super-productivity-rest-mcp
displayName: Super Productivity REST API Access
description: >-
  Platzhalter-Kit für den Zugriff auf die Super Productivity Local REST API
  (läuft auf dem Host unter 127.0.0.1:3876, erreicht via host.docker.internal).
  Aktuell ohne eigene Setup-Logik — die Netzwerkfreigabe passiert separat über
  `sbx policy allow network` (siehe README.md), NICHT deklarativ im Kit (siehe
  Hinweis unten). Der MCP-Server ist ein noch folgender Ausbauschritt (TODO.md
  Schritt 7); sobald der Setup-Schritte braucht, kommen die hier rein.

# KORREKTUR (2026-09-14): Diese Datei enthielt zuvor einen `permissions.network.allow`-
# Block, angelehnt an eine WebFetch-Zusammenfassung von docs.docker.com/ai/sandboxes/
# customize/kit-reference.md. Der bei dir installierte `sbx` lehnt das mit
# "field permissions not found in type spec.SpecFile" ab — das Feld existiert in dieser
# sbx-Version schlüssig nicht. Netzwerkfreigabe läuft stattdessen über das separate,
# in unseren Projekt-Instruktionen mit Sicherheit dokumentierte Host-Kommando
# `sbx policy allow network <domain>[,<domain>…]` (siehe README.md). Für Schritt 7
# (setup/install/files im Kit) ist ebenfalls noch offen, ob das dort vermutete Schema
# (`setup: install:`/`files:`) stimmt — siehe TODO.md, dort wird vor Schritt 7 die
# tatsächliche Schema-Referenz deiner sbx-Version eingeholt (z.B. via `sbx kit --help`),
# statt erneut auf ungeprüfte Doku-Zusammenfassungen zu vertrauen.
