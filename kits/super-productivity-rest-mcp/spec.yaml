schemaVersion: "2"
kind: mixin
name: super-productivity-rest-mcp
displayName: Super Productivity REST API Access
description: >-
  Gibt der Sandbox Netzwerkzugriff auf die Super Productivity Local REST API,
  die auf dem Host unter 127.0.0.1:3876 läuft (erreicht via host.docker.internal),
  und registriert bei jedem Sandbox-Start den MCP-Server aus dem veröffentlichten
  Container-Image ghcr.io/maystar/super-productivity-rest-mcp, der die REST-Endpunkte
  als Claude-Code-Tools kapselt. Der Server-Quellcode liegt jetzt im eigenständigen
  Projekt ../super-productivity-rest-mcp/ (siehe dessen README.md). Siehe TODO.md/README.md
  hier für Details und Verifikationsstand.

# Hinweis: Der ursprüngliche Versuch mit schemaVersion "1" scheiterte am echten sbx mit
# "field permissions not found in type spec.SpecFile" — nicht weil das Feld grundsätzlich
# nicht existiert (der Nutzer verwendet permissions.network.allow bereits erfolgreich in
# anderen Kits), sondern weil es offenbar erst ab schemaVersion "2" Teil des Schemas ist.
#
# Verifiziert (TODO.md Schritt 6/6b, 2026-09-14): host.docker.internal:3876 matcht und
# funktioniert (/health und /status beide 200). localhost:3876 bleibt zusätzlich in der
# Allow-Liste, da es harmlos ist und die Diagnose in Schritt 6 abgesichert hat.
permissions:
  network:
    allow:
      - host.docker.internal:3876
      - localhost:3876
      - ghcr.io:443

# Verifiziert gegen die reale Kit-Referenz (docs.docker.com/ai/sandboxes/customize/kit-reference/,
# abgerufen 2026-09-14 im Rahmen von Schritt 7 — von hier aus tatsächlich erreichbar, kein
# zusätzlicher Netzwerk-Freigabe-Bedarf): unter schemaVersion "2" heißt der Top-Level-Schlüssel
# `setup:` (nicht `commands:` wie im verworfenen Vorgänger-Kit, siehe Git-Commit `e275fba` — das
# war unter schemaVersion "1" ohnehin nie sbx-getestet). `setup.startup` läuft bei JEDEM
# Sandbox-Start, argv-Form (kein Shell-Parsing), Default-User "1000" (agent) — passend, weil
# ~/.claude.json dem Agent-User gehört. Startup-Commands MÜSSEN idempotent sein (laufen bei jedem
# Neustart erneut) — deshalb hier: `docker pull` ist selbst idempotent, `mcp remove` vor `mcp add`.
#
# Seit 2026-09-15 (Schritt 8/9): Der Server kommt nicht mehr aus lokalem Quellcode
# (kits/super-productivity-rest-mcp/mcp-server/, entfernt), sondern aus dem veröffentlichten
# Image ghcr.io/maystar/super-productivity-rest-mcp. `docker pull` + `claude mcp add ... --
# docker run ...` wurden manuell in der laufenden Sandbox verifiziert: Pull erfolgreich (nach
# Freigabe von ghcr.io:443 in permissions.network.allow, s.o.), `claude mcp list` zeigt den
# Server als "✔ Connected". Proxy-Env-Vars werden analog zum vorherigen lokalen Docker-Aufbau
# durchgereicht, da der Container sonst keinen Zugriff auf host.docker.internal über den
# sbx-Proxy hätte.
#
# ⚠️ Noch nicht End-to-End getestet: Ob dieser `setup.startup`-Block bei einem echten `sbx run`
# (frische Sandbox) tatsächlich wie hier angenommen ausgeführt wird. Vor dem nächsten `sbx run`
# idealerweise einmal gegenprüfen.
setup:
  startup:
    - command:
        - sh
        - -c
        - |
          set -u
          exec >>"$HOME/.cache/super-productivity-mcp-setup.log" 2>&1
          mkdir -p "$HOME/.cache"
          printf '=== %s ===\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          export PATH="$HOME/.local/bin:$HOME/.claude/local:$PATH"
          IMAGE="ghcr.io/maystar/super-productivity-rest-mcp:latest"
          docker pull "$IMAGE" || { echo "FEHLER: docker pull fehlgeschlagen"; exit 0; }
          claude mcp remove super-productivity --scope user >/dev/null 2>&1 || true
          claude mcp add super-productivity --scope user -- \
            docker run -i --rm \
              -e SP_REST_TOKEN -e SP_REST_BASE_URL \
              -e HTTP_PROXY -e HTTPS_PROXY -e NO_PROXY \
              -e http_proxy -e https_proxy -e no_proxy \
              -e NODE_USE_ENV_PROXY \
              "$IMAGE" \
            || echo "FEHLER: claude mcp add fehlgeschlagen"
      user: "1000"
      background: false
      description: "Super-Productivity-MCP-Server-Image ziehen und user-scoped registrieren"
